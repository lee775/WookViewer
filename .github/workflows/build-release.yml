name: Build Release APK

# 정식 서명된 release APK + AAB 빌드.
# 사전 준비 — keystore 는 로컬에서 생성한다: `bash scripts/generate-release-keystore.sh`
# 그 뒤 출력된 값으로 secret 3 개 설정 (서명키는 CI 에서 만들거나 내보내지 않는다):
#  - RELEASE_KEYSTORE_BASE64 — base64 인코딩된 jks
#  - RELEASE_KEYSTORE_PASSWORD — store/key 패스워드
#  - RELEASE_KEY_ALIAS — key alias (기본 wookviewer)

on:
  workflow_dispatch:
    inputs:
      include_lo_native:
        description: 'LibreOffice native libs 포함 (Office 편집/렌더 가능)'
        type: boolean
        default: true
      lo_run_id:
        description: 'LO 네이티브 빌드 run ID'
        default: '25715886381'
      build_aab:
        description: 'AAB 도 함께 빌드 (Play Store 업로드용)'
        type: boolean
        default: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets present
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret 없음 — generate-keystore 워크플로 먼저 실행"
            exit 1
          fi
          if [ -z "$PW" ]; then
            echo "::error::RELEASE_KEYSTORE_PASSWORD secret 없음"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore from secret
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$B64" | base64 -d > keystore/wookviewer-release.jks
          ls -la keystore/
          # 파일 유효성 검증
          keytool -list -keystore keystore/wookviewer-release.jks \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.RELEASE_KEY_ALIAS }}" > /dev/null
          echo "keystore 검증 OK"

      - name: Download LibreOffice native libs + assets
        if: ${{ inputs.include_lo_native == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          gh run download "${{ inputs.lo_run_id }}" -D /tmp/lo-bundle -R "${{ github.repository }}"
          SO_DIR=$(find /tmp/lo-bundle -maxdepth 2 -name "libreoffice-android-arm64-v8a-*" -type d | head -1)
          [ -n "$SO_DIR" ] && cp "$SO_DIR"/*.so app/src/main/jniLibs/arm64-v8a/
          ASSETS_DIR=$(find /tmp/lo-bundle -maxdepth 2 -name "libreoffice-android-assets-*" -type d | head -1)
          [ -n "$ASSETS_DIR" ] && cp -r "$ASSETS_DIR"/* app/src/main/assets/
          echo "=== Native libs ==="
          ls -lah app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "(none)"
          echo "=== Assets ==="
          du -sh app/src/main/assets/ 2>/dev/null || echo "(none)"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release version: $VERSION"

      - name: Build Release APK + AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/keystore/wookviewer-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ inputs.build_aab }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Collect outputs
        run: |
          mkdir -p artifacts
          VER="${{ steps.version.outputs.version }}"
          # APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "artifacts/WookViewer-v${VER}-release.apk"
          fi
          # AAB (optional)
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab \
               "artifacts/WookViewer-v${VER}-release.aab"
          fi
          echo "=== Artifacts ==="
          ls -lah artifacts/
          # 서명 검증
          echo "=== APK 서명 검증 ==="
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --verbose \
            "artifacts/WookViewer-v${VER}-release.apk" || echo "(apksigner 경로 다를 수 있음 — 결과 무관)"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WookViewer-v${{ steps.version.outputs.version }}-release
          path: artifacts/
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -rf keystore/
