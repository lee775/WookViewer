name: Build LibreOffice for Android

# 수동 트리거만 — LibreOffice core 빌드는 4-8시간 소요.
# 결과 산출물(.so 파일들)은 워크플로 artifact로 업로드되며,
# 그 후 GitHub Release에 첨부하거나 app/src/main/jniLibs/ 에 넣어 커밋한다.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: '빌드 대상 ABI (콤마구분, 예: arm64-v8a,armeabi-v7a)'
        default: 'arm64-v8a'
        required: true
      lo_branch:
        description: 'LibreOffice core git 브랜치/태그'
        default: 'libreoffice-26-2'
        required: true

# 단일 잡 — 한 ABI당 4시간+, GitHub-hosted runner의 6시간 한도 안에서 단일 ABI만 권장.
# 여러 ABI 필요하면 matrix 로 분리 (각각 별도 잡, 동시 실행).
jobs:
  build:
    runs-on: ubuntu-24.04  # LO 26-2 가 GCC 12+ 요구 — 22.04(GCC 11) 부족
    timeout-minutes: 360  # 6시간 한도

    strategy:
      matrix:
        abi: [arm64-v8a]  # 입력 ABIs 를 동적으로 펼치려면 set-matrix 단계 필요

    steps:
      - name: Checkout this repo (for build configs)
        uses: actions/checkout@v4

      - name: Setup JDK 17 (sdkmanager 요구사항)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          # LO 26-2 는 NDK r27+ 요구 (configure: error: Building for Android requires NDK version >= 27.*)
          # r27c LTS (clang 18)
          packages: 'platforms;android-28 build-tools;28.0.3 ndk;27.3.13750724'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # LO build-side(host) 컴파일에 필요한 모든 도구/라이브러리 일괄 설치
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin pkg-config \
            flex bison gperf nasm \
            python3 python3-dev python3-pip \
            gcc g++ make patch \
            zip unzip git wget curl \
            xsltproc libxml2-utils \
            libssl-dev libcrypt-dev \
            libxml2-dev libxslt1-dev \
            zlib1g-dev liblzma-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libx11-dev \
            libgl-dev libglu1-mesa-dev \
            libpng-dev libjpeg-dev \
            ccache

      - name: Free disk space (LO build needs ~40GB)
        run: |
          # SDK 보존하고 다른 큰 패키지만 제거
          echo "== Before =="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /home/linuxbrew
          # AGENT_TOOLSDIRECTORY는 보통 /opt/hostedtoolcache — 캐시는 비웠지만
          # Android SDK는 별도 위치라 안전
          sudo apt-get remove -y --purge ghc* podman* docker-* google-chrome-* firefox-* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo "== After =="
          df -h

      - name: Clone LibreOffice core
        run: |
          # 우리 repo 안에 clone하면 LO Gradle이 우리 settings.gradle.kts를 잘못 잡음.
          # $HOME 하위로 별도 clone — Gradle 디렉토리 상향 검색에서 충돌 회피.
          git clone --depth 1 --branch ${{ inputs.lo_branch }} \
            https://git.libreoffice.org/core "$HOME/lo-core"
          echo "LO_SRC=$HOME/lo-core" >> $GITHUB_ENV

      # ccache 캐시 복원 — 이전 빌드의 결과물 가져오기
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: lo-ccache-${{ inputs.lo_branch }}-${{ matrix.abi }}-${{ github.sha }}
          restore-keys: |
            lo-ccache-${{ inputs.lo_branch }}-${{ matrix.abi }}-
            lo-ccache-${{ inputs.lo_branch }}-

      - name: Configure ccache for build
        run: |
          mkdir -p ~/.ccache
          # 최대 캐시 크기 — GitHub Actions cache 10GB 한도 안에서
          ccache -M 5G
          ccache -s

      - name: Configure LibreOffice for Android (${{ matrix.abi }})
        working-directory: ${{ env.LO_SRC }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          # LO는 distro-configs/ 에 ABI별 설정 파일을 둠.
          # --with-distro=X 는 distro-configs/X.conf 를 읽음.
          case "${{ matrix.abi }}" in
            arm64-v8a)   DISTRO=LibreOfficeAndroidAarch64 ;;
            armeabi-v7a) DISTRO=LibreOfficeAndroidArm ;;
            x86_64)      DISTRO=LibreOfficeAndroidX86_64 ;;
            x86)         DISTRO=LibreOfficeAndroidX86 ;;
            *) echo "지원하지 않는 ABI: ${{ matrix.abi }}" && exit 1 ;;
          esac
          # distro 설정 파일이 실제로 있는지 확인 — 없으면 LO 버전과 안 맞는 것
          if [ ! -f "distro-configs/${DISTRO}.conf" ]; then
            echo "::error::distro-configs/${DISTRO}.conf 없음 — LO ${{ inputs.lo_branch }} 와 호환되는 distro 이름 확인 필요"
            ls distro-configs/ | grep -i android || true
            exit 1
          fi
          # distro-configs는 NDK 경로를 명시 안 함 → 인자로 직접 전달
          # --enable-ccache 로 컴파일 캐시 활용 (재시도 시 결정적 가속)
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./autogen.sh \
            --with-distro="$DISTRO" \
            --with-android-ndk="$ANDROID_NDK_HOME" \
            --with-android-sdk="$ANDROID_HOME" \
            --with-android-api-level=28 \
            --enable-ccache

      - name: Build LibreOffice (실제 빌드 — 수 시간)
        working-directory: ${{ env.LO_SRC }}
        timeout-minutes: 330  # 5.5h, runner 6h 한도 보호
        run: |
          # LO의 Android Gradle 단계에 lint 가 'abortOnError=true' 로 설정되어 있어
          # LO 자체 Java 코드의 사소한 경고로도 빌드가 죽음. 우리는 .so만 필요.
          # 빌드 전에 LO의 lint 설정 무력화 (printf로 append — YAML 친화)
          GRADLE_CONFIG="$LO_SRC/android/source/build.gradle"
          if [ -f "$GRADLE_CONFIG" ]; then
            echo "== Patching LO Android Gradle to disable lint =="
            printf '\n\n// Patched by WookViewer workflow\nandroid { lint { abortOnError = false; checkReleaseBuilds = false; ignoreWarnings = true } }\n' >> "$GRADLE_CONFIG"
          fi

          # ccache 가 캐시 hit 시 컴파일 시간 거의 0 — 재시도가 매우 빠름.
          # -k 옵션: 한 모듈 실패해도 다른 모듈 계속
          # 빌드 실패해도 .so 가 만들어졌으면 다음 step 에서 픽업
          make -j$(nproc) -k || true
          ccache -s

      # 빌드 성공/실패 무관하게 ccache 저장 — 부분 진행도 보존 → 다음 빌드 가속
      - name: Save ccache (always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: lo-ccache-${{ inputs.lo_branch }}-${{ matrix.abi }}-${{ github.sha }}-${{ github.run_id }}

      - name: Locate output .so
        working-directory: ${{ env.LO_SRC }}
        run: |
          # make 단계가 부분 실패해도 .so 가 만들어졌으면 픽업.
          echo "== All .so files in LO build tree =="
          find . -name "*.so" -type f 2>/dev/null | head -30 || true
          echo "== Looking for liblo-native-code.so =="
          ARTIFACT=$(find . -name "liblo-native-code.so" -type f 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "::error::liblo-native-code.so 를 못 찾음 — make 단계가 너무 일찍 실패한 듯"
            exit 1
          fi
          echo "Found: $ARTIFACT"
          ls -lah "$ARTIFACT"
          mkdir -p "$GITHUB_WORKSPACE/jniLibs/${{ matrix.abi }}"
          cp "$ARTIFACT" "$GITHUB_WORKSPACE/jniLibs/${{ matrix.abi }}/"
          # 보조 라이브러리 함께 수집 (NSS 트리플 등 — LibreOfficeKit.java NativeLibLoader 기준)
          for lib in nspr4 plds4 plc4 nssutil3 freebl3 sqlite3 softokn3 nss3 nssckbi nssdbm3 smime3 ssl3 c++_shared; do
            FOUND=$(find . -name "lib${lib}.so" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$GITHUB_WORKSPACE/jniLibs/${{ matrix.abi }}/" && echo "+ lib${lib}.so"
            else
              echo "- lib${lib}.so (없음 — 정적링크일 수 있음)"
            fi
          done
          ls -lah "$GITHUB_WORKSPACE/jniLibs/${{ matrix.abi }}/"

      - name: Collect LO assets (services.rdb, types, registry, bootstrap)
        working-directory: ${{ env.LO_SRC }}
        run: |
          # LO 가 LibreOfficeKit.init 시점에 APK assets/program/ 에서 읽는 파일들 수집.
          # 이게 없으면 LOK init이 native에서 죽음.
          ASSETS_OUT="$GITHUB_WORKSPACE/lo-assets"
          mkdir -p "$ASSETS_OUT/program" "$ASSETS_OUT/share"

          echo "== Looking for LO Android assets staging dir =="
          # LO Android 빌드는 보통 android/source/assets/ 에 필요한 파일을 stage 함
          STAGING="$LO_SRC/android/source/assets"
          if [ -d "$STAGING" ]; then
            echo "Found staging at $STAGING"
            ls -lah "$STAGING" | head -20
            cp -r "$STAGING"/* "$ASSETS_OUT/" 2>/dev/null || true
          fi

          # instdir 에서도 핵심 파일 복사 (fallback / 보완)
          INSTDIR="$LO_SRC/instdir"
          if [ -d "$INSTDIR" ]; then
            echo "Found instdir at $INSTDIR"
            # 부팅에 필요한 핵심 파일들
            for f in services.rdb services/services.rdb fundamentalrc bootstraprc unorc; do
              SRC=$(find "$INSTDIR/program" -name "$(basename $f)" -type f 2>/dev/null | head -1)
              if [ -n "$SRC" ]; then
                cp "$SRC" "$ASSETS_OUT/program/" && echo "+ $(basename $f)"
              fi
            done
            # types/*.rdb
            if [ -d "$INSTDIR/program/types" ]; then
              cp -r "$INSTDIR/program/types" "$ASSETS_OUT/program/" && echo "+ types/"
            fi
            # registry data
            if [ -d "$INSTDIR/share/registry" ]; then
              cp -r "$INSTDIR/share/registry" "$ASSETS_OUT/share/" && echo "+ share/registry/"
            fi
          fi

          # LO 가 만든 APK가 있으면 거기서 assets 추출 (가장 정확)
          LO_APK=$(find "$LO_SRC/android/source/build/outputs/apk" -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$LO_APK" ]; then
            echo "== Extracting from LO APK: $LO_APK =="
            mkdir -p /tmp/lo-apk-x
            unzip -o "$LO_APK" "assets/*" -d /tmp/lo-apk-x 2>&1 | tail -5
            if [ -d /tmp/lo-apk-x/assets ]; then
              # APK 내용이 가장 신뢰할 만하니 이걸로 덮어씀
              rm -rf "$ASSETS_OUT"/*
              cp -r /tmp/lo-apk-x/assets/* "$ASSETS_OUT/"
              echo "Replaced with APK extracted assets"
            fi
          fi

          echo "== Final asset structure =="
          du -sh "$ASSETS_OUT" || true
          find "$ASSETS_OUT" -maxdepth 3 -type d | head -20
          find "$ASSETS_OUT" -type f | wc -l

      - name: Upload LO assets artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-android-assets-${{ inputs.lo_branch }}
          path: lo-assets/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-android-${{ matrix.abi }}-${{ inputs.lo_branch }}
          path: jniLibs/${{ matrix.abi }}/
          retention-days: 30

      # NOTE: 자동으로 main에 커밋하지 않음 — 산출물이 ~100MB라 git에 부담.
      # 다운로드해서 별도 git-lfs 또는 GitHub Release에 첨부 권장.
