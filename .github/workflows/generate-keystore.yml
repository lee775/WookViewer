name: Generate Release Keystore

# 한 번만 실행 — 릴리즈 서명용 keystore 를 생성하고 base64 로 출력.
# 실행 후:
#  1. 워크플로 로그에서 RELEASE_KEYSTORE_BASE64 와 RELEASE_KEYSTORE_PASSWORD 복사
#  2. GitHub repo → Settings → Secrets → Actions 에 동일 이름으로 추가
#  3. (선택) 다운로드 가능한 artifact 의 jks 파일을 안전한 곳에 백업 — 분실 시 같은 키로 서명 불가
#
# WARNING: 이 키를 잃으면 같은 패키지로 업데이트 APK 를 만들 수 없음. 반드시 백업할 것.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (default: wookviewer)'
        required: false
        default: 'wookviewer'
      validity_years:
        description: 'Validity in years (Play Store 권장: 25년+)'
        required: false
        default: '30'
      dname:
        description: 'Subject distinguished name'
        required: false
        default: 'CN=WookViewer, OU=Wook, O=Wook, L=Seoul, ST=Seoul, C=KR'

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate strong random password
        id: pw
        run: |
          PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)
          echo "::add-mask::$PW"
          echo "password=$PW" >> "$GITHUB_OUTPUT"

      - name: Generate keystore
        env:
          PW: ${{ steps.pw.outputs.password }}
          ALIAS: ${{ inputs.key_alias }}
          VALIDITY: ${{ inputs.validity_years }}
          DNAME: ${{ inputs.dname }}
        run: |
          mkdir -p out
          VALIDITY_DAYS=$((VALIDITY * 365))
          keytool -genkeypair -v \
            -keystore out/wookviewer-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$VALIDITY_DAYS" \
            -storepass "$PW" -keypass "$PW" \
            -dname "$DNAME"
          ls -la out/

      - name: Encode keystore as base64
        env:
          PW: ${{ steps.pw.outputs.password }}
          ALIAS: ${{ inputs.key_alias }}
        run: |
          B64=$(base64 -w0 out/wookviewer-release.jks)
          echo "::add-mask::$B64"
          {
            echo "# 🔐 Release Keystore Generated"
            echo ""
            echo "## 다음 secret 들을 GitHub repo 에 추가하세요:"
            echo "(Settings → Secrets and variables → Actions → New repository secret)"
            echo ""
            echo "| Secret name | Value |"
            echo "|---|---|"
            echo "| RELEASE_KEYSTORE_BASE64 | (아래 base64 블록 — masked) |"
            echo "| RELEASE_KEYSTORE_PASSWORD | (아래 password — masked) |"
            echo "| RELEASE_KEY_ALIAS | $ALIAS |"
            echo ""
            echo "**중요**: 로그에서 masked 값이 \`***\` 로 보이면 워크플로 raw log 에서 복사해야 함:"
            echo "(\`Actions\` 탭 → 이 run → \`...\` 메뉴 → \`View raw logs\`)"
            echo ""
            echo "또는 artifact 로 다운로드한 \`keystore-bundle.txt\` 에서 복사."
            echo ""
            echo "## 백업 필수"
            echo "artifact 의 \`wookviewer-release.jks\` 를 안전한 곳에 저장하세요."
            echo "분실 시 같은 키로 APK 업데이트 불가 → Play Store 에 새 앱으로 올려야 함."
          } >> "$GITHUB_STEP_SUMMARY"

          # 사용자 복사용 텍스트 파일 (artifact 로 업로드, 절대 commit 금지)
          {
            echo "=== KEEP THIS SECRET — 절대 commit 하지 말 것 ==="
            echo ""
            echo "RELEASE_KEYSTORE_BASE64:"
            echo "$B64"
            echo ""
            echo "RELEASE_KEYSTORE_PASSWORD:"
            echo "$PW"
            echo ""
            echo "RELEASE_KEY_ALIAS:"
            echo "$ALIAS"
          } > out/keystore-bundle.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-DO-NOT-LOSE
          path: out/
          retention-days: 30
